<svg xmlns="http://www.w3.org/2000/svg" width="414" height="896" viewBox="0 0 414 896" role="img" aria-labelledby="title desc">
  <title id="title">Smart Shower iOS interface preview</title>
  <desc id="desc">A preview of the app's main screen with a temperature picker and a start shower button.</desc>
  <rect width="414" height="896" fill="#f7fbff"/>
  <rect x="0" y="0" width="414" height="44" fill="#e9f2fb"/>
  <text x="207" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#1b2a38">Desired Shower Temperature °F</text>
  <line x1="32" y1="154" x2="382" y2="154" stroke="#d6e0ea"/>
  <line x1="32" y1="546" x2="382" y2="546" stroke="#d6e0ea"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="207" y="214" font-size="32" fill="#9aa8b5">76°</text>
    <text x="207" y="286" font-size="38" fill="#6e7f8e">77°</text>
    <text x="207" y="368" font-size="54" fill="#1b2a38">78°</text>
    <text x="207" y="452" font-size="38" fill="#6e7f8e">79°</text>
    <text x="207" y="524" font-size="32" fill="#9aa8b5">80°</text>
  </g>
  <rect x="0" y="672" width="414" height="146" fill="#34c759"/>
  <text x="207" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#ffffff">Start Shower</text>
  <rect x="0" y="862" width="414" height="34" fill="#e9f2fb"/>
</svg>
